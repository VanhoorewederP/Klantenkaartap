<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kaarten PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Barcode & QR CDN scripts (Stabiele versies) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* Zorgt dat video feed netjes binnen container blijft */
    #reader video { object-fit: cover; border-radius: 0.75rem; }
    /* Voorkom zoomen op input op iOS */
    input[type="text"] { font-size: 16px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 select-none">

  <!-- Header -->
  <header class="p-4 bg-slate-800 shadow-lg flex justify-between items-center sticky top-0 z-10 border-b border-slate-700">
    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2"><span>💳</span> Mijn Kaarten</h1>
    <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition shadow-md active:scale-95">
      + Nieuw
    </button>
  </header>

  <!-- Kaartenlijst -->
  <main class="p-4 max-w-md mx-auto">
    <div id="cardList" class="grid gap-3.5">
      <!-- Kaarten verschijnen hier -->
    </div>
  </main>

  <!-- Modal: Toon barcode fullscreen -->
  <div id="viewModal" class="fixed inset-0 bg-black/90 flex items-center justify-center p-4 hidden z-5030" onclick="closeModalOnBgClick(event)">
    <div class="bg-white text-slate-900 w-full max-w-sm rounded-3xl p-8 flex flex-col items-center gap-5 text-center shadow-2xl transition-transform transform scale-95" id="viewModalContent">
      <h2 id="viewTitle" class="text-2xl font-extrabold tracking-tight"></h2>
      
      <!-- Renderplek barcode / QR -->
      <div class="w-full flex justify-center py-6 overflow-hidden min-h-[150px] items-center bg-slate-50 rounded-2xl border border-slate-100">
        <svg id="barcodeCanvas" class="max-w-full hidden"></svg>
        <div id="qrcodeCanvas" class="hidden"></div>
      </div>

      <p id="viewCode" class="font-mono text-lg tracking-widest font-bold text-slate-700 bg-slate-100 px-4 py-1.5 rounded-lg"></p>
      
      <button onclick="closeModal('viewModal')" class="w-full bg-slate-900 text-white hover:bg-slate-800 py-4 rounded-xl font-bold mt-4 shadow-lg active:scale-95 transition">
        Sluiten
      </button>
    </div>
  </div>

  <!-- Modal: Kaart Toevoegen / Scannen -->
  <div id="addModal" class="fixed inset-0 bg-slate-950/95 flex items-center justify-center p-4 hidden z-20 overflow-y-auto" onclick="closeModalOnBgClick(event)">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 flex flex-col gap-5 text-white shadow-2xl my-8">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">Nieuwe Kaart</h2>
        <button onclick="closeModal('addModal')" class="text-slate-500 hover:text-white p-1">✕</button>
      </div>
      
      <!-- Camera Scanner Container -->
      <div id="scanner-container" class="hidden overflow-hidden rounded-xl bg-black border-2 border-blue-500 shadow-inner relative">
        <div id="reader" style="width: 100%; min-height: 200px;"></div>
        <div class="absolute inset-0 border-2 border-dashed border-white/50 m-12 rounded-lg pointer-events-none"></div>
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <button id="scanBtn" onclick="toggleScanner()" class="bg-slate-700 hover:bg-slate-600 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition active:scale-95">
          <span id="scanBtnIcon">📷</span> <span id="scanBtnText">Scan Camera</span>
        </button>
        
        <!-- Screenshot knop -->
        <button onclick="triggerFileImport()" class="bg-slate-700 hover:bg-slate-600 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition active:scale-95">
          🖼️ Kies Foto
        </button>
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="importFromImage(this)">
      </div>

      <div class="border-t border-slate-700 pt-4 mt-1 flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Winkelnaam</label>
          <input id="cardName" type="text" placeholder="bijv. Colruyt, Action, Delhaize" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 mt-1.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-white">
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Barcode / Code Nummer</label>
          <input id="cardNumber" type="text" placeholder="Scan of typ het nummer" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 mt-1.5 font-mono focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-white" data-format="AUTO">
        </div>
      </div>

      <div class="flex gap-3 pt-3 mt-auto">
        <button onclick="closeModal('addModal')" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3.5 rounded-xl font-semibold transition active:scale-95">Annuleren</button>
        <button onclick="saveCard()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold transition shadow-md active:scale-95">Opslaan</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Init & State ---
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    let cards = JSON.parse(localStorage.getItem('cards') || '[]');
    let html5QrCode = null; // Scanner instance

    // --- 2. Core Functionaliteit ---
    function renderCards() {
      const container = document.getElementById('cardList');
      container.innerHTML = '';
      if (cards.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-600 py-16 border-2 border-dashed border-slate-800 rounded-2xl"><p class="text-5xl mb-4">📭</p><p class="text-sm">Nog geen kaarten.<br>Tik op "Nieuw" om te beginnen.</p></div>';
        return;
      }
      // Sorteer alfabetisch
      cards.sort((a, b) => a.name.localeCompare(b.name)).forEach((card, index) => {
        const item = document.createElement('div');
        item.className = 'bg-slate-800 border border-slate-700 rounded-2xl p-4 flex justify-between items-center cursor-pointer hover:border-blue-500/50 transition active:scale-[0.98] shadow-sm';
        item.innerHTML = `
          <div onclick="showCard(${index})" class="flex-1 pr-4">
            <h3 class="font-bold text-lg text-white truncate">${card.name}</h3>
            <p class="text-xs font-mono text-slate-400 mt-1 tracking-wider bg-slate-900/50 px-2 py-0.5 rounded inline-block">${card.code}</p>
          </div>
          <button onclick="deleteCard(${index})" class="text-slate-600 hover:text-red-400 p-2 ml-2 text-xl font-light transition">✕</button>
        `;
        container.appendChild(item);
      });
    }

    // --- 3. Tonen van Kaart ---
    function showCard(index) {
      const card = cards[index];
      document.getElementById('viewTitle').innerText = card.name;
      document.getElementById('viewCode').innerText = card.code;
      const barcodeSvg = document.getElementById('barcodeCanvas');
      const qrcodeContainer = document.getElementById('qrcodeCanvas');
      qrcodeContainer.innerHTML = ''; // Clear QR

      // QR of Barcode check
      const isQR = card.format?.includes('QR') || card.code.startsWith('http') || card.code.length > 25 || card.code.includes(' ');

      if (isQR) {
        barcodeSvg.classList.add('hidden');
        qrcodeContainer.classList.remove('hidden');
        try {
          new QRCode(qrcodeContainer, { text: card.code, width: 220, height: 220, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
        } catch(e) { qrcodeContainer.innerText = "QR Fout"; }
      } else {
        qrcodeContainer.classList.add('hidden');
        barcodeSvg.classList.remove('hidden');
        try {
          JsBarcode(barcodeSvg, card.code, { format: "auto", lineColor: "#000000", width: 2, height: 90, displayValue: false, margin: 10 });
        } catch (e) {
          // Fallback
          try { JsBarcode(barcodeSvg, card.code, { format: "CODE128", lineColor: "#000000", width: 2, height: 90, displayValue: false }); }
          catch(e2) { barcodeSvg.classList.add('hidden'); qrcodeContainer.classList.remove('hidden'); qrcodeContainer.innerText = "Barcode Formaat Fout"; }
        }
      }
      document.getElementById('viewModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('viewModalContent').classList.remove('scale-95'), 10);
    }

    // --- 4. Toevoegen & Opslaan ---
    function openAddModal() {
      document.getElementById('cardName').value = '';
      document.getElementById('cardNumber').value = '';
      document.getElementById('cardNumber').dataset.format = 'AUTO';
      document.getElementById('addModal').classList.remove('hidden');
      document.body.classList.add('overflow-hidden'); // Voorkom scrollen achtergrond
    }

    function saveCard() {
      const name = document.getElementById('cardName').value.trim();
      const code = document.getElementById('cardNumber').value.trim();
      const format = document.getElementById('cardNumber').dataset.format || 'AUTO';
      if (!name || !code) return alert('Vul aub een winkelnaam en code in.');
      cards.push({ name, code, format });
      localStorage.setItem('cards', JSON.stringify(cards));
      renderCards();
      closeModal('addModal');
    }

    // --- 5. Camera Scanner (Verbeterde Stop Logica) ---
    async function toggleScanner() {
      const container = document.getElementById('scanner-container');
      const scanBtnText = document.getElementById('scanBtnText');
      const scanBtnIcon = document.getElementById('scanBtnIcon');

      // Als scanner nog niet bestaat, maak aan
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      // Check huidige staat
      const state = html5QrCode.getState();

      // Starten (indien idle of gestopt)
      if (state === 1 || state === 2) { 
        container.classList.remove('hidden');
        scanBtnText.innerText = "Stop Scanner";
        scanBtnIcon.innerText = "⏹";
        document.getElementById('scanBtn').classList.replace('bg-slate-700', 'bg-red-600');

        const config = { fps: 15, qrbox: { width: 280, height: 160 }, aspectRatio: 1.0 };
        
        try {
          await html5QrCode.start(
            { facingMode: "environment" }, // Gebruik achtercamera
            config,
            (decodedText, decodedResult) => {
              // SUCCESS CALLBACK
              document.getElementById('cardNumber').value = decodedText;
              document.getElementById('cardNumber').dataset.format = decodedResult?.result?.format?.formatName || 'AUTO';
              navigator.vibrate?.(100); // Tril feedback (indien ondersteund)
              forceStopScanner(); // Stop direct na scan
            },
            (errorMessage) => { /* Foutjes tijdens scannen negeren */ }
          );
        } catch (err) {
          // INITIALISATIE FOUT (Camera geweigerd, HTTPS probleem, etc.)
          console.error("Camera Fout:", err);
          container.classList.add('hidden');
          resetScanBtnUI();
          
          if (err?.includes("NotAllowedError") || err?.includes("Permission denied")) {
            alert("⚠️ Camera Toegang Geweigerd:\n\nJe browser heeft geen toegang tot de camera. Ga naar je browserinstellingen voor deze site en sta de camera toe.");
          } else {
            alert("Kan camera niet starten. Zorg dat je op HTTPS zit en geen andere app de camera gebruikt.");
          }
        }
      } else if (state === 3) {
        // Is aan het scannen -> STOPPEN
        forceStopScanner();
      }
    }

    // Robuuste stop-functie
    async function forceStopScanner() {
      if (html5QrCode && html5QrCode.getState() === 3) {
        try {
          await html5QrCode.stop();
        } catch (err) {
          console.error("Fout bij stoppen:", err);
        }
      }
      // UI Reset ongeacht of stop succesvol was (voor de zekerheid)
      document.getElementById('scanner-container').classList.add('hidden');
      resetScanBtnUI();
    }

    function resetScanBtnUI() {
      document.getElementById('scanBtnText').innerText = "Scan Camera";
      document.getElementById('scanBtnIcon').innerText = "📷";
      document.getElementById('scanBtn').classList.replace('bg-red-600', 'bg-slate-700');
    }

    // --- 6. Import van Screenshot/Afbeelding (NIEUW) ---
    function triggerFileImport() {
      forceStopScanner(); // Stop camera als die aanstond
      document.getElementById('fileInput').click(); // Open bestandskiezer
    }

    async function importFromImage(input) {
      if (!input.files || input.files.length === 0) return;
      
      const file = input.files[0];
      const cardNumberInput = document.getElementById('cardNumber');
      
      // UI even op 'laden' zetten
      cardNumberInput.value = "Bezig met scannen...";
      cardNumberInput.classList.add('animate-pulse', 'text-blue-400');

      // Gebruik tijdelijke scanner instance als de hoofdscanner aanstaat
      let tempScanner = html5QrCode;
      if (!tempScanner || tempScanner.getState() === 3) {
          tempScanner = new Html5Qrcode("reader"); // Tijdelijke onzichtbare container
      }

      try {
        const decodedText = await tempScanner.scanFile(file, false); // false = toon image niet
        // SUCCESS
        cardNumberInput.value = decodedText;
        cardNumberInput.dataset.format = 'AUTO'; // we weten formaat niet zeker via file scan
        navigator.vibrate?.([50, 50]); 
      } catch (err) {
        // FAILED TO FIND BARCODE
        console.warn("Geen code gevonden op foto:", err);
        cardNumberInput.value = "";
        alert("⚠️ Geen barcode gevonden:\n\nKan geen duidelijke barcode of QR-code vinden op deze foto. Zorg dat de code goed zichtbaar en scherp is.");
      } finally {
        // UI Herstellen
        cardNumberInput.classList.remove('animate-pulse', 'text-blue-400');
        input.value = ''; // Reset file input
        // Als we een temp scanner maakten, clear die
        if (tempScanner !== html5QrCode) { tempScanner.clear(); }
      }
    }

    // --- 7. Helpers & UI ---
    function deleteCard(index) {
      if (confirm(`⚠️ Verwijder "${cards[index].name}" permanent?`)) {
        cards.splice(index, 1);
        localStorage.setItem('cards', JSON.stringify(cards));
        renderCards();
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
      if (id === 'viewModal') { document.getElementById('viewModalContent').classList.add('scale-95'); }
      forceStopScanner(); // Altijd camera stoppen bij sluiten modal
    }

    function closeModalOnBgClick(e) {
      if (e.target === e.currentTarget) { closeModal(e.currentTarget.id); }
    }

    // Init Page
    renderCards();
  </script>
</body>
</html>

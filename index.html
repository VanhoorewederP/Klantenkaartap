<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Klantenkaarten</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JsBarcode & QR Code (stabiele CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16">

  <!-- Header -->
  <header class="p-4 bg-slate-800 shadow flex justify-between items-center sticky top-0 z-10">
    <h1 class="text-xl font-bold tracking-tight text-white">💳 Mijn Kaarten</h1>
    <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">
      + Nieuw
    </button>
  </header>

  <!-- Kaartenlijst -->
  <main class="p-4 max-w-md mx-auto">
    <div id="cardList" class="grid gap-3"></div>
  </main>

  <!-- Modal: Toon barcode fullscreen -->
  <div id="viewModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-30">
    <div class="bg-white text-slate-900 w-full max-w-sm rounded-2xl p-6 flex flex-col items-center gap-4 text-center shadow-2xl">
      <h2 id="viewTitle" class="text-xl font-bold"></h2>
      
      <!-- Renderplek barcode / QR -->
      <div class="w-full flex justify-center py-4 overflow-hidden">
        <svg id="barcodeCanvas" class="max-w-full hidden"></svg>
        <div id="qrcodeCanvas" class="hidden"></div>
      </div>

      <p id="viewCode" class="font-mono text-sm tracking-widest font-semibold text-slate-700"></p>
      
      <button onclick="closeModal('viewModal')" class="w-full bg-slate-200 hover:bg-slate-300 py-3 rounded-xl font-semibold mt-2">
        Sluiten
      </button>
    </div>
  </div>

  <!-- Modal: Kaart Toevoegen / Scannen -->
  <div id="addModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-20">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 flex flex-col gap-4 text-white shadow-2xl">
      <h2 class="text-lg font-bold">Nieuwe Kaart Toevoegen</h2>
      
      <!-- Camera Scanner Container -->
      <div id="scanner-container" class="hidden overflow-hidden rounded-xl bg-black border border-slate-700">
        <div id="reader" style="width: 100%;"></div>
      </div>
      <button id="scanBtn" onclick="toggleScanner()" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-sm font-medium">
        📷 Scan met Camera
      </button>

      <div>
        <label class="text-xs font-semibold text-slate-400">Winkelnaam</label>
        <input id="cardName" type="text" placeholder="bijv. Colruyt, Decathlon" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 mt-1 focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-400">Barcode / Nummer</label>
        <input id="cardNumber" type="text" placeholder="Nummer van de code" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 mt-1 font-mono focus:outline-none focus:border-blue-500">
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeModal('addModal')" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl font-medium">Annuleren</button>
        <button onclick="saveCard()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl font-semibold">Opslaan</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Service Worker registratie
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // 2. Data State
    let cards = JSON.parse(localStorage.getItem('cards') || '[]');
    let html5QrCode = null;

    function renderCards() {
      const container = document.getElementById('cardList');
      container.innerHTML = '';

      if (cards.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 text-sm mt-8">Nog geen kaarten opgeslagen. Voeg er een toe via de knop rechtsboven.</p>';
        return;
      }

      cards.forEach((card, index) => {
        const item = document.createElement('div');
        item.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 flex justify-between items-center cursor-pointer hover:border-blue-500/50 transition';
        item.innerHTML = `
          <div onclick="showCard(${index})" class="flex-1">
            <h3 class="font-semibold text-lg text-white">${card.name}</h3>
            <p class="text-xs font-mono text-slate-400 mt-0.5">${card.code}</p>
          </div>
          <button onclick="deleteCard(${index})" class="text-slate-500 hover:text-red-400 p-2 ml-2 text-sm font-bold">✕</button>
        `;
        container.appendChild(item);
      });
    }

    // 3. Kaart tonen & genereren
    function showCard(index) {
        const card = cards[index];
        document.getElementById('viewTitle').innerText = card.name;
        document.getElementById('viewCode').innerText = card.code;

        const barcodeSvg = document.getElementById('barcodeCanvas');
        const qrcodeContainer = document.getElementById('qrcodeCanvas');
        
        // Maak vorige renders leeg
        qrcodeContainer.innerHTML = '';
        barcodeSvg.innerHTML = '';

        // Bepaal of het een QR code of een klassieke barcode is
        const isQRCode = card.format === 'QR_CODE' || card.code.startsWith('http') || card.code.length > 30;

        if (isQRCode) {
            barcodeSvg.classList.add('hidden');
            qrcodeContainer.classList.remove('hidden');
            
            // Genereer QR code
            new QRCode(qrcodeContainer, {
            text: card.code,
            width: 200,
            height: 200,
            correctLevel: QRCode.CorrectLevel.M
            });
        } else {
            qrcodeContainer.classList.add('hidden');
            barcodeSvg.classList.remove('hidden');
            
            try {
            JsBarcode(barcodeSvg, card.code, {
                format: "auto",
                lineColor: "#000000",
                width: 2,
                height: 80,
                displayValue: false
            });
            } catch (e) {
            JsBarcode(barcodeSvg, card.code, { 
                format: "CODE128", 
                width: 2, 
                height: 80, 
                displayValue: false 
            });
            }
        }

        document.getElementById('viewModal').classList.remove('hidden');
    }

    // 4. Kaart toevoegen
    function openAddModal() {
      document.getElementById('cardName').value = '';
      document.getElementById('cardNumber').value = '';
      document.getElementById('addModal').classList.remove('hidden');
    }

    function saveCard() {
      const name = document.getElementById('cardName').value.trim();
      const code = document.getElementById('cardNumber').value.trim();

      if (!name || !code) return alert('Vul zowel een naam als een barcode in.');

      cards.push({ name, code, format: 'AUTO' });
      localStorage.setItem('cards', JSON.stringify(cards));
      renderCards();
      closeModal('addModal');
    }

    function deleteCard(index) {
      if (confirm(`Verwijder "${cards[index].name}"?`)) {
        cards.splice(index, 1);
        localStorage.setItem('cards', JSON.stringify(cards));
        renderCards();
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      stopScanner();
    }

    // 5. Barcode Scanner Functionaliteit
    function toggleScanner() {
      const container = document.getElementById('scanner-container');
      const scanBtn = document.getElementById('scanBtn');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
        container.classList.remove('hidden');
        scanBtn.innerText = "⏹ Stop Scanner";

        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 150 } },
          (decodedText, decodedResult) => {
            document.getElementById('cardNumber').value = decodedText;
            stopScanner();
          },
          (error) => {}
        ).catch(err => {
          alert("Kan camera niet openen: " + err);
          stopScanner();
        });
      } else {
        stopScanner();
      }
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
          document.getElementById('scanner-container').classList.add('hidden');
          document.getElementById('scanBtn').innerText = "📷 Scan met Camera";
        }).catch(() => {
          html5QrCode = null;
        });
      }
    }

    // Init
    renderCards();
  </script>
</body>
</html>
